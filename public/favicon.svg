<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <path d="M 35 65 Q 50 20 65 65" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="50" cy="38" r="4" fill="#00ff88" filter="url(#glow)"/>
</svg>